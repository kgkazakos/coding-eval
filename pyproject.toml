[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-eval"
version = "0.1.0"
description = "Measures LLM thematic coding accuracy and agreement rates against human coders"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kostas Kazakos", email = "kostas@cpr.so" }]
keywords = ["ux-research", "thematic-coding", "inter-rater-agreement", "llm-evaluation", "cohens-kappa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = [
    "dspy-ai>=2.4",
    "litellm>=1.40",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
gemini = ["google-generativeai>=0.5"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
coding-eval = "coding_eval.cli:cli"

[project.urls]
Homepage = "https://github.com/kgkazakos/coding-eval"
Repository = "https://github.com/kgkazakos/coding-eval"

[tool.setuptools.packages.find]
where = ["."]
include = ["coding_eval*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
